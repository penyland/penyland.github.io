  const currentTheme = (() => {

    if (["dark", "light"].includes(localStorageTheme)) {

    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {

  if (currentTheme === "light") {

  } else {

      : "light";

  };

  document

    .addEventListener("click", handleToggleClick);
